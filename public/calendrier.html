<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0c2024">
  <meta name="robots" content="noindex">
  <meta name="referrer" content="no-referrer">
  <title>Calendrier de l'Avent</title>
  <!-- Aperçu du lien dans les messageries. {{ORIGINE}} est remplacé par le serveur. -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Un calendrier de l'Avent rien que pour vous">
  <meta property="og:description" content="24 cases, une surprise par jour jusqu'à Noël.">
  <meta property="og:image" content="{{ORIGINE}}/img/partage.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Fraunces:ital,opsz,wght@0,9..144,300..900;1,9..144,300..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/calendrier.css">
</head>
<body>
  <canvas id="neige" class="neige" aria-hidden="true"></canvas>
  <div id="guirlande" class="guirlande" aria-hidden="true"></div>

  <main class="page">
    <header class="entete">
      <p class="surtitre">Calendrier de l'Avent</p>
      <h1 id="titre" class="titre">&nbsp;</h1>
      <p id="message" class="message"></p>
      <p id="statut" class="statut"></p>
      <p id="progression" class="progression"></p>
    </header>

    <section id="plateau" class="plateau" aria-label="Les 24 cases du calendrier"></section>

    <div id="introuvable" class="introuvable" hidden>
      <p class="introuvable-titre">Ce calendrier s'est perdu dans la neige.</p>
      <p>Vérifiez l'adresse qu'on vous a donnée.</p>
    </div>
  </main>

  <footer class="pied" aria-hidden="true">
    <svg class="collines" viewBox="0 0 400 90" preserveAspectRatio="none">
      <path d="M0 55 C 60 25, 110 30, 170 50 S 290 75, 400 35 L 400 90 L 0 90 Z" fill="#dfe8ec" />
      <path d="M0 70 C 80 50, 150 58, 220 70 S 340 80, 400 62 L 400 90 L 0 90 Z" fill="#f4f8f9" />
    </svg>
  </footer>

  <dialog id="carte" class="carte" aria-labelledby="carte-date">
    <div class="carte-papier" tabindex="-1" autofocus>
      <button type="button" class="carte-fermer" data-fermer aria-label="Fermer">
        <svg viewBox="0 0 24 24" width="22" height="22"><path d="M6 6 L18 18 M18 6 L6 18" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
      </button>
      <p id="carte-date" class="carte-date"></p>
      <figure id="carte-figure" class="carte-figure" hidden>
        <span class="carte-scotch" aria-hidden="true"></span>
        <img id="carte-image" alt="">
      </figure>
      <p id="carte-texte" class="carte-texte"></p>
      <svg class="carte-signature" viewBox="0 0 24 24" aria-hidden="true"><use href="#motif-houx"/></svg>
    </div>
  </dialog>

  <div id="bulle" class="bulle" role="status" aria-live="polite"></div>

  <!-- Petits motifs dessinés, réutilisés sur les portes -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="motif-etoile" viewBox="0 0 24 24">
      <path d="M12 2.5 L14.6 9 L21.5 9.4 L16.1 13.8 L17.9 20.6 L12 16.8 L6.1 20.6 L7.9 13.8 L2.5 9.4 L9.4 9 Z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/>
    </symbol>
    <symbol id="motif-flocon" viewBox="0 0 24 24">
      <g fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round">
        <path d="M12 2 V22 M3.3 7 L20.7 17 M3.3 17 L20.7 7"/>
        <path d="M9.5 3.5 L12 6 L14.5 3.5 M9.5 20.5 L12 18 L14.5 20.5"/>
        <path d="M3.6 10.4 L7 9 L5.9 5.6 M18.1 18.4 L17 15 L20.4 13.6"/>
        <path d="M3.6 13.6 L7 15 L5.9 18.4 M18.1 5.6 L17 9 L20.4 10.4"/>
      </g>
    </symbol>
    <symbol id="motif-houx" viewBox="0 0 24 24">
      <g fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round">
        <path d="M11 13 C 9 11, 7.5 12, 6 10 C 5 11.5, 3.5 11, 2.5 10.5 C 3 12.5, 2 13.5, 3 15 C 5 14.5, 6.5 16, 8 15.5 C 8.5 14.5, 10 14.5, 11 13 Z"/>
        <path d="M13 13 C 15 11, 16.5 12, 18 10 C 19 11.5, 20.5 11, 21.5 10.5 C 21 12.5, 22 13.5, 21 15 C 19 14.5, 17.5 16, 16 15.5 C 15.5 14.5, 14 14.5, 13 13 Z"/>
      </g>
      <circle cx="12" cy="11" r="1.8" fill="currentColor"/>
      <circle cx="10.2" cy="8.6" r="1.5" fill="currentColor"/>
      <circle cx="13.6" cy="8.4" r="1.5" fill="currentColor"/>
    </symbol>
    <symbol id="motif-sapin" viewBox="0 0 24 24">
      <path d="M12 2 L17 9 H14.5 L19 15 H15.5 L20 21 H4 L8.5 15 H5 L9.5 9 H7 Z" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/>
      <path d="M12 21 V23" stroke="currentColor" stroke-width="1.6"/>
    </symbol>
    <symbol id="motif-lune" viewBox="0 0 24 24">
      <path d="M15 3 A9 9 0 1 0 21 15.5 A7 7 0 1 1 15 3 Z" fill="none" stroke="currentColor" stroke-width="1.4"/>
      <circle cx="18" cy="5" r="0.9" fill="currentColor"/>
      <circle cx="21" cy="9" r="0.6" fill="currentColor"/>
    </symbol>
    <symbol id="motif-cadeau" viewBox="0 0 24 24">
      <g fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round">
        <rect x="3.5" y="9" width="17" height="12" rx="1"/>
        <rect x="2.5" y="6.5" width="19" height="3.5" rx="0.8"/>
        <path d="M12 6.5 V21"/>
        <path d="M12 6.5 C 9 2, 5.5 4, 8 6.5 M12 6.5 C 15 2, 18.5 4, 16 6.5"/>
      </g>
    </symbol>
  </svg>

  <script src="/js/calendrier.js"></script>
</body>
</html>
